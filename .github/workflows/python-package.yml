name: Django Backend CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality Checks

    runs-on: ubuntu-latest

    # Environment variables required by Django in CI
    env:
      SECRET_KEY: "ci-only-dummy-secret-key"
      DB_NAME: "tcc_ci_db"
      DB_USER: "tcc_ci_user"
      DB_PASSWORD: "ci-only-dummy-password"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"


    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check code formatting
        run: python -m black --check .

      - name: Lint with Flake8
        run: |
          python -m flake8 apps/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python -m pytest apps/accounts/tests/ -v